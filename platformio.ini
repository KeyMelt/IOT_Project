; Dependency manifest and reproducible builds for Asset Tracker (Arduino Uno).
; Arduino IDE users can still open TrackerCode/TrackerCode.ino directly.

[platformio]
default_envs = uno
src_dir = TrackerCode

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    blynkkk/Blynk@1.3.2
    mikalhart/TinyGPSPlus@1.1.0
